name: GroupGuard CI

on:
  push:
    paths:
      - "onebot-plugin-groupguard/**"
      - "scripts/windows/**"
      - "GROUPGUARD-UPDATE.cmd"
      - "ROLLBACK-GROUPGUARD.cmd"
      - ".gitattributes"
      - ".github/workflows/groupguard-ci.yml"
  pull_request:
    paths:
      - "onebot-plugin-groupguard/**"
      - "scripts/windows/**"
      - "GROUPGUARD-UPDATE.cmd"
      - "ROLLBACK-GROUPGUARD.cmd"
      - ".gitattributes"
      - ".github/workflows/groupguard-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onebot-plugin-groupguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: onebot-plugin-groupguard/package-lock.json
      - run: npm ci
      - name: Audit production dependencies for high/critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Run semantic TypeScript lint
        run: npx tsc -p tsconfig.lint.json --noEmit
      - name: Typecheck TypeScript scripts
        run: npx tsc -p tsconfig.scripts.json --noEmit
      - name: Enforce Windows PowerShell 5.1-safe launcher encoding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('../scripts/windows/groupguard-update.ps1'),
              Path('../scripts/windows/groupguard-rollback.ps1'),
              Path('../scripts/windows/groupguard-update-89-121.ps1'),
              Path('../scripts/windows/groupguard-deploy-bundle.ps1'),
          ]
          bad = []
          for path in files:
              data = path.read_bytes()
              if any(byte > 0x7F for byte in data):
                  bad.append(str(path))
          if bad:
              raise SystemExit(
                  'Windows PowerShell 5.1 launch-critical .ps1 files must stay ASCII-only '
                  'unless the launcher contract is explicitly changed to a BOM-aware path: '
                  + ', '.join(bad)
              )
          print('Windows PowerShell 5.1 launcher encoding guard passed')
          PY
      - name: Enforce LF-only remote shell transport
        shell: bash
        run: |
          set -euo pipefail
          grep -qxF '*.sh text eol=lf' ../.gitattributes
          helpers=(
            ../scripts/windows/groupguard-remote-deploy.sh
            ../scripts/windows/groupguard-remote-rollback.sh
            ../scripts/windows/groupguard-remote-topology.sh
          )
          for helper in "${helpers[@]}"; do
            if LC_ALL=C grep -n $'\r' "$helper"; then
              echo "remote shell helper contains CR bytes: $helper" >&2
              exit 1
            fi
          done
          launchers=(
            ../scripts/windows/groupguard-update.ps1
            ../scripts/windows/groupguard-rollback.ps1
            ../scripts/windows/groupguard-deploy-bundle.ps1
          )
          for launcher in "${launchers[@]}"; do
            grep -Fq 'function New-LfHelperCopy' "$launcher"
            grep -Fq '.Replace("`r`n", "`n").Replace("`r", "`n")' "$launcher"
            grep -Fq 'UTF8Encoding($false)' "$launcher"
            grep -Fq 'LF normalization failed for remote helper' "$launcher"
          done
      - name: Validate deployment PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem scripts/ops/*.ps1
            Get-ChildItem ../scripts/windows/*.ps1
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
              exit 1
            }
          }
      - name: Validate remote deployment shell helpers
        run: |
          sh -n ../scripts/windows/groupguard-remote-deploy.sh
          sh -n ../scripts/windows/groupguard-remote-rollback.sh
          sh -n ../scripts/windows/groupguard-remote-topology.sh
      - name: Forbid executable deployment-state loading
        shell: bash
        run: |
          set -euo pipefail
          helpers=(
            ../scripts/windows/groupguard-remote-deploy.sh
            ../scripts/windows/groupguard-remote-rollback.sh
            ../scripts/windows/groupguard-remote-topology.sh
          )
          if grep -nE '^[[:space:]]*(\.|source)[[:space:]]+' "${helpers[@]}"; then
            echo 'deployment helpers must not source/dot execute remote data' >&2
            exit 1
          fi
          if grep -nE '^[[:space:]]*eval[[:space:]]+' "${helpers[@]}"; then
            echo 'deployment helpers must never eval persisted or discovered data' >&2
            exit 1
          fi
          grep -q 'state_value()' ../scripts/windows/groupguard-remote-deploy.sh
          grep -q 'state_value()' ../scripts/windows/groupguard-remote-rollback.sh
      - name: Require authenticated exact-build deployment health verification
        shell: bash
        run: |
          set -euo pipefail
          helpers=(
            ../scripts/windows/groupguard-remote-deploy.sh
            ../scripts/windows/groupguard-remote-rollback.sh
          )
          for helper in "${helpers[@]}"; do
            grep -q "x-groupguard-token" "$helper"
            grep -q "/api/build-info" "$helper"
            grep -q "/api/health" "$helper"
            grep -q "GROUPGUARD_WEBUI_TOKEN" "$helper"
            grep -q "GROUPGUARD_DATA_DIR" "$helper"
            if grep -q "/api/readyz" "$helper" && ! grep -q "All WebUI API routes" "$helper"; then
              echo "unexpected legacy readiness probe in $helper" >&2
              exit 1
            fi
          done
          deploy_helper=../scripts/windows/groupguard-remote-deploy.sh
          grep -q 'RECONCILE_ROLLBACK_STATE_MISSING' "$deploy_helper"
          grep -q 'RECONCILE_BACKUP_COMMIT_MISMATCH' "$deploy_helper"
      - name: Verify deployment helpers reject unsafe remote paths before mutation
        shell: bash
        run: |
          set -euo pipefail
          commit='0123456789abcdef0123456789abcdef01234567'
          sha='0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          if sh ../scripts/windows/groupguard-remote-deploy.sh /tmp/not-groupguard /mnt/sda1/groupguard/backups groupguard-snowluma "$commit" /tmp/candidate.tar.gz release-safe "$sha"; then
            echo 'remote deploy helper accepted unsafe APP_DIR' >&2
            exit 1
          fi
          if sh ../scripts/windows/groupguard-remote-rollback.sh /tmp/not-groupguard /mnt/sda1/groupguard/backups groupguard-snowluma; then
            echo 'remote rollback helper accepted unsafe APP_DIR' >&2
            exit 1
          fi
      - name: Verify Windows launchers reject unsafe remote paths before tooling/deploy
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File ../scripts/windows/groupguard-update.ps1 -RemoteAppDir '/tmp/not-groupguard'
          $updateCode = $LASTEXITCODE
          if ($updateCode -eq 0) { throw 'groupguard-update.ps1 accepted unsafe RemoteAppDir' }
          & pwsh -NoLogo -NoProfile -File ../scripts/windows/groupguard-rollback.ps1 -RemoteAppDir '/tmp/not-groupguard'
          $rollbackCode = $LASTEXITCODE
          if ($rollbackCode -eq 0) { throw 'groupguard-rollback.ps1 accepted unsafe RemoteAppDir' }
          Write-Host "Unsafe-path guards rejected as expected: update=$updateCode rollback=$rollbackCode"
          exit 0
      - name: Verify one-click updater rejects a non-canonical Git origin
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'groupguard-wrong-origin'
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          & git -C $tmp init | Out-Null
          & git -C $tmp remote add origin 'https://github.com/example/not-groupguard.git'
          & pwsh -NoLogo -NoProfile -File ../scripts/windows/groupguard-update.ps1 -RepoPath $tmp
          $code = $LASTEXITCODE
          if ($code -eq 0) { throw 'groupguard-update.ps1 accepted a non-canonical origin' }
          Write-Host "Wrong-origin guard rejected as expected: exit=$code"
          exit 0
      - run: npm run build:snowluma
      - name: Verify cross-repository contracts with local mocks
        env:
          TEST_GROUP_ID: mock-test-group
        run: node scripts/integration/verify-lolapisevers-contracts.mjs --mode mock
