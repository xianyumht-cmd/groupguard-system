name: GroupGuard CI

on:
  push:
    paths:
      - "onebot-plugin-groupguard/**"
      - "scripts/windows/**"
      - "GROUPGUARD-UPDATE.cmd"
      - "ROLLBACK-GROUPGUARD.cmd"
      - ".github/workflows/groupguard-ci.yml"
  pull_request:
    paths:
      - "onebot-plugin-groupguard/**"
      - "scripts/windows/**"
      - "GROUPGUARD-UPDATE.cmd"
      - "ROLLBACK-GROUPGUARD.cmd"
      - ".github/workflows/groupguard-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onebot-plugin-groupguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: onebot-plugin-groupguard/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Validate deployment PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem scripts/ops/*.ps1
            Get-ChildItem ../scripts/windows/*.ps1
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
              exit 1
            }
          }
      - name: Validate remote deployment shell helpers
        run: |
          sh -n ../scripts/windows/groupguard-remote-deploy.sh
          sh -n ../scripts/windows/groupguard-remote-rollback.sh
      - name: Verify deployment helpers reject unsafe remote paths before mutation
        shell: bash
        run: |
          set -euo pipefail
          commit='0123456789abcdef0123456789abcdef01234567'
          sha='0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          if sh ../scripts/windows/groupguard-remote-deploy.sh /tmp/not-groupguard /mnt/sda1/groupguard/backups groupguard-snowluma "$commit" /tmp/candidate.tar.gz release-safe "$sha"; then
            echo 'remote deploy helper accepted unsafe APP_DIR' >&2
            exit 1
          fi
          if sh ../scripts/windows/groupguard-remote-rollback.sh /tmp/not-groupguard /mnt/sda1/groupguard/backups groupguard-snowluma; then
            echo 'remote rollback helper accepted unsafe APP_DIR' >&2
            exit 1
          fi
      - name: Verify Windows launchers reject unsafe remote paths before tooling/deploy
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File ../scripts/windows/groupguard-update.ps1 -RemoteAppDir '/tmp/not-groupguard'
          if ($LASTEXITCODE -eq 0) { throw 'groupguard-update.ps1 accepted unsafe RemoteAppDir' }
          & pwsh -NoLogo -NoProfile -File ../scripts/windows/groupguard-rollback.ps1 -RemoteAppDir '/tmp/not-groupguard'
          if ($LASTEXITCODE -eq 0) { throw 'groupguard-rollback.ps1 accepted unsafe RemoteAppDir' }
      - run: npm run build:snowluma
      - name: Verify cross-repository contracts with local mocks
        env:
          TEST_GROUP_ID: mock-test-group
        run: node scripts/integration/verify-lolapisevers-contracts.mjs --mode mock
