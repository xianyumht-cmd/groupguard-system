name: Build immutable deployment d0b79b6e v3

on:
  push:
    branches: [deploy/immutable-d0b79b6e-20260801]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_COMMIT: d0b79b6eab2514492196036bd79f14819b2d4102

    steps:
      - name: Checkout packager
        uses: actions/checkout@v4
        with:
          path: packager

      - name: Checkout immutable candidate
        uses: actions/checkout@v4
        with:
          ref: d0b79b6eab2514492196036bd79f14819b2d4102
          path: candidate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/onebot-plugin-groupguard/package-lock.json

      - name: Test and build exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/onebot-plugin-groupguard
          npm ci
          npm test
          export GROUPGUARD_COMMIT_SHA="$TARGET_COMMIT"
          export GROUPGUARD_BUILD_TIME_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm run build:snowluma
          node --check dist/snowluma-service.mjs
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("dist/build-info.json","utf8"));if(p.commit_sha!==process.env.TARGET_COMMIT)throw new Error("build commit mismatch");'

      - name: Build v3 package
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p work/payload work/output
          cp -a candidate/onebot-plugin-groupguard/dist work/payload/dist
          cat > work/payload/DEPLOYMENT-METADATA.json <<JSON
          {
            "repository": "xianyumht-cmd/groupguard-system",
            "commit": "$TARGET_COMMIT",
            "artifact": "onebot-plugin-groupguard/dist",
            "entry": "dist/snowluma-service.mjs",
            "built_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "deployment_mode": "immutable-dist-atomic-switch",
            "remote_app": "/mnt/sda1/groupguard/app",
            "container": "groupguard-snowluma"
          }
          JSON
          (
            cd work/payload
            find dist DEPLOYMENT-METADATA.json -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > MANIFEST.sha256
          )
          tar -C work/payload --sort=name --owner=0 --group=0 --numeric-owner -cf - dist MANIFEST.sha256 DEPLOYMENT-METADATA.json | gzip -n > work/candidate.tar.gz
          node packager/deployment/build-immutable-d0b79b6e.mjs work/candidate.tar.gz work/output "$TARGET_COMMIT"
          node packager/deployment/fix-immutable-d0b79b6e-v2.mjs work/output/deploy-groupguard-d0b79b6e.ps1
          node packager/deployment/fix-immutable-d0b79b6e-v3.mjs work/output/deploy-groupguard-d0b79b6e.ps1 work/output/README.txt work/output/PACKAGE-MANIFEST.txt

      - name: Validate launchers and package
        shell: bash
        run: |
          set -Eeuo pipefail
          PS1_PATH="$(realpath work/output/deploy-groupguard-d0b79b6e.ps1)"
          export PS1_PATH
          pwsh -NoProfile -Command '$t=$null;$e=$null;[System.Management.Automation.Language.Parser]::ParseFile($env:PS1_PATH,[ref]$t,[ref]$e)|Out-Null;if($e.Count){$e|ForEach-Object{Write-Error $_.Message};exit 1}'
          node <<'NODE'
          const fs=require('fs');
          const bytes=fs.readFileSync(process.env.PS1_PATH);
          for(let i=0;i<bytes.length;i++){const b=bytes[i];if(b<32&&![9,10,13].includes(b))throw new Error(`illegal control byte at ${i}`)}
          const source=bytes.toString('utf8');
          for(const text of [
            "GroupGuard immutable production deployment package v3",
            "$BuildInfoPath = Join-Path (Join-Path $ExtractPath 'dist') 'build-info.json'",
            "$EntryPath = Join-Path (Join-Path $ExtractPath 'dist') 'snowluma-service.mjs'"
          ]) if(!source.includes(text)) throw new Error(`launcher text missing: ${text}`);
          const match=source.match(/\$RemoteScriptBase64 = '([^']+)'/);if(!match)throw new Error('remote payload missing');
          const remote=Buffer.from(match[1],'base64').toString('utf8');fs.writeFileSync('/tmp/remote-v3.sh',remote);
          for(const text of ['TOKEN_COMPATIBILITY_OK=true','TOKEN_MIGRATION_OK=true','validated_legacy_token','persistent_token_file','container_environment','restore_token_file','docker restart -t 20 "$CONTAINER"','ROLLBACK_OK=true','DEPLOYMENT_OK=true','/api/livez','/api/readyz','/api/build-info']) if(!remote.includes(text)) throw new Error(`remote text missing: ${text}`);
          NODE
          bash -n /tmp/remote-v3.sh
          grep -Fq 'Package fix   : v3' work/output/README.txt
          grep -Fq 'package_revision=3' work/output/PACKAGE-MANIFEST.txt
          grep -Fq 'token_compatibility=auto-env-legacy-file' work/output/PACKAGE-MANIFEST.txt
          (
            cd work/output
            sha256sum * > PACKAGE-FILES.sha256
          )

      - name: Upload v3 package
        uses: actions/upload-artifact@v4
        with:
          name: groupguard-production-safe-deployment-d0b79b6e-v3
          path: work/output/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
