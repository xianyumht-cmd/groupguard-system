name: seal-no-video-dist-20260730

on:
  pull_request:
    branches:
      - feat/groupguard-shard-intranet-migration-20260729
    paths:
      - .github/workflows/seal-no-video-dist-20260730.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal-dist:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact verified commit
        uses: actions/checkout@v4
        with:
          ref: 3ea7af2c42dee65700c8b10bd43e1bc819ba43e2
          fetch-depth: 1

      - name: Verify exact source commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "3ea7af2c42dee65700c8b10bd43e1bc819ba43e2"
          test -z "$(git status --porcelain)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: onebot-plugin-groupguard/package-lock.json

      - name: Install dependencies
        working-directory: onebot-plugin-groupguard
        run: npm ci

      - name: Run complete verification suite
        working-directory: onebot-plugin-groupguard
        run: npm test

      - name: Scan runtime source
        shell: bash
        run: |
          set -euo pipefail
          marker='我要看|设置看视频接口|删除看视频接口|看视频接口列表|videoApiTemplates|query\.video|video\.info|intranet_video_runtime_plugin|registerIntranetVideoCommandPlugins'
          if grep -RInaE "$marker" onebot-plugin-groupguard/src onebot-plugin-groupguard/config; then
            echo 'Retired video-query marker found in runtime source.' >&2
            exit 1
          fi

      - name: Build SnowLuma release dist
        working-directory: onebot-plugin-groupguard
        run: npm run build:snowluma

      - name: Seal SnowLuma dist manifest
        shell: bash
        working-directory: onebot-plugin-groupguard
        run: |
          set -euo pipefail
          test -d dist
          test -f dist/snowluma-service.mjs
          test -f dist/build-info.json
          node - <<'NODE'
          const fs = require('fs');
          const info = JSON.parse(fs.readFileSync('dist/build-info.json', 'utf8'));
          if (info.commit_sha !== '3ea7af2c42dee65700c8b10bd43e1bc819ba43e2') throw new Error('build commit mismatch');
          if (info.dirty !== false) throw new Error('dirty build');
          if (info.service !== 'groupguard') throw new Error('service mismatch');
          if (info.artifact !== 'snowluma-service.mjs') throw new Error('SnowLuma artifact mismatch');
          NODE
          if find dist -type f -iname '*video*' -print -quit | grep -q .; then
            echo 'Video-named file found in dist.' >&2
            find dist -type f -iname '*video*' -print >&2
            exit 1
          fi
          marker='我要看|设置看视频接口|删除看视频接口|看视频接口列表|videoApiTemplates|query\.video|video\.info|intranet_video_runtime_plugin|registerIntranetVideoCommandPlugins'
          if grep -RInaE "$marker" dist; then
            echo 'Retired video-query marker found in dist.' >&2
            exit 1
          fi
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > DIST-SHA256SUMS.txt
          cat > DIST-RELEASE-MANIFEST.json <<'JSON'
          {
            "schema": "groupguard-snowluma-dist-release.v1",
            "source_commit": "3ea7af2c42dee65700c8b10bd43e1bc819ba43e2",
            "runtime_commit": "3ea7af2c42dee65700c8b10bd43e1bc819ba43e2",
            "api_commit": "f221b64649763eb8d325d87348fd2f42f48a6485",
            "entry_artifact": "snowluma-service.mjs",
            "video_category": "retired",
            "delivery_protocol": "groupguard-query-delivery.v1",
            "pr": 17
          }
          JSON

      - name: Upload sealed SnowLuma dist only
        uses: actions/upload-artifact@v4
        with:
          name: groupguard-snowluma-no-video-dist-3ea7af2c42de
          path: |
            onebot-plugin-groupguard/dist
            onebot-plugin-groupguard/DIST-SHA256SUMS.txt
            onebot-plugin-groupguard/DIST-RELEASE-MANIFEST.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 90
