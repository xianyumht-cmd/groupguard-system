name: Temporary PR59 Review Remediation

on:
  push:
    paths:
      - '.github/workflows/tmp-pr59-review-remediation-20260910.yml'

permissions:
  contents: write

jobs:
  remediate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/per-group-self-recall-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: onebot-plugin-groupguard/package-lock.json
      - name: Apply review remediation
        run: python scripts/tmp_pr59_review_remediation_20260910.py
      - name: Install dependencies
        working-directory: onebot-plugin-groupguard
        run: npm ci --no-audit --no-fund
      - name: Focused verification
        working-directory: onebot-plugin-groupguard
        run: |
          npm run verify:per-group-self-recall
          npm run typecheck
          npm run verify:config-inheritance
          npm run verify:action-queue
          npm run verify:webui-ios-glass
      - name: Full test suite
        working-directory: onebot-plugin-groupguard
        run: npm test
      - name: Commit verified remediation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onebot-plugin-groupguard/webui/config.html
          git add onebot-plugin-groupguard/src/services/action_queue_service.ts
          git add onebot-plugin-groupguard/scripts/test_per_group_self_recall_contract.mjs
          git add onebot-plugin-groupguard/package.json
          git add docs/DECISIONS.md docs/ARCHITECTURE.md docs/PITFALLS.md docs/PROJECT_STATE.md
          git add -A docs/PMT_PER_GROUP_SELF_RECALL_2026-09-10.md
          git commit -m "fix: address per-group self-recall review findings"
          git push origin HEAD:feat/per-group-self-recall-20260910
