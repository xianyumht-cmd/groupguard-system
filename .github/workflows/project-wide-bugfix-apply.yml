name: Project-wide bugfix apply

on:
  push:
    branches:
      - fix/project-wide-bugs-20260801
    paths:
      - scripts/apply-project-wide-bug-fixes-20260801.mjs
      - scripts/run-project-wide-bug-fixes-20260801.mjs
      - .github/workflows/project-wide-bugfix-apply.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-wide-bugfix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-wide-bugs-20260801
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: onebot-plugin-groupguard/package-lock.json

      - name: Apply audited fixes
        run: node scripts/run-project-wide-bug-fixes-20260801.mjs

      - name: Install dependencies
        working-directory: onebot-plugin-groupguard
        run: npm ci

      - name: Run full verification
        working-directory: onebot-plugin-groupguard
        run: npm test

      - name: Verify clean SnowLuma build
        working-directory: onebot-plugin-groupguard
        run: npm run build:snowluma

      - name: Commit verified fixes
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No code changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve project-wide audited bugs"
          git push origin HEAD:fix/project-wide-bugs-20260801
