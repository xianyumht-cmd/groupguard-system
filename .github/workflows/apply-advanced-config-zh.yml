name: Apply Advanced Config Chinese Localization

on:
  push:
    branches:
      - feat/webui-advanced-config-zh

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: onebot-plugin-groupguard/package-lock.json

      - name: Apply localization codemod
        working-directory: onebot-plugin-groupguard
        run: node scripts/apply-advanced-config-zh.mjs

      - name: Install dependencies
        working-directory: onebot-plugin-groupguard
        run: npm ci

      - name: Verify Chinese localization
        working-directory: onebot-plugin-groupguard
        run: node scripts/verify-advanced-config-zh.mjs

      - name: Run full tests
        working-directory: onebot-plugin-groupguard
        run: npm test

      - name: Build SnowLuma
        working-directory: onebot-plugin-groupguard
        run: npm run build:snowluma

      - name: Commit generated localization
        shell: bash
        run: |
          if git diff --quiet -- onebot-plugin-groupguard/src/standalone/admin/static_page.ts; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onebot-plugin-groupguard/src/standalone/admin/static_page.ts
          git commit -m "feat(webui): localize advanced configuration fields"
          git push origin HEAD:feat/webui-advanced-config-zh
