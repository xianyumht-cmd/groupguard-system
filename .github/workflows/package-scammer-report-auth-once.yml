name: Package scammer report auth once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  package:
    if: github.head_ref == 'release/scammer-report-auth-package-20260804'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production candidate
        uses: actions/checkout@v4
        with:
          ref: 7446e4f8225e5c3aff6f2e168acdad16d7b8e8d0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: onebot-plugin-groupguard/package-lock.json

      - name: Install, test and build SnowLuma candidate
        working-directory: onebot-plugin-groupguard
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build:snowluma
          test -f dist/snowluma-service.mjs

      - name: Create immutable manifest and archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/candidate
          cp -a onebot-plugin-groupguard/dist release/candidate/dist
          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('release/candidate')
          files = []
          for path in sorted((root / 'dist').rglob('*')):
              if not path.is_file():
                  continue
              raw = path.read_bytes()
              files.append({
                  'path': path.relative_to(root).as_posix(),
                  'bytes': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
              })
          entry = root / 'dist' / 'snowluma-service.mjs'
          manifest = {
              'schema': 'groupguard-scammer-report-auth-candidate.v1',
              'source_commit': '7446e4f8225e5c3aff6f2e168acdad16d7b8e8d0',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'entry': 'dist/snowluma-service.mjs',
              'entry_sha256': hashlib.sha256(entry.read_bytes()).hexdigest(),
              'file_count': len(files),
              'files': files,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({k: manifest[k] for k in ['source_commit', 'entry_sha256', 'file_count']}, indent=2))
          PY
          tar -C release -czf groupguard-scammer-report-auth-candidate-7446e4f8225e.tar.gz candidate
          sha256sum groupguard-scammer-report-auth-candidate-7446e4f8225e.tar.gz > groupguard-scammer-report-auth-candidate-7446e4f8225e.tar.gz.sha256

      - name: Upload immutable candidate
        uses: actions/upload-artifact@v4
        with:
          name: groupguard-scammer-report-auth-dist-7446e4f8225e
          path: |
            groupguard-scammer-report-auth-candidate-7446e4f8225e.tar.gz
            groupguard-scammer-report-auth-candidate-7446e4f8225e.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
