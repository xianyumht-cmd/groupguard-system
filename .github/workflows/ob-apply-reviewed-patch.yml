name: OB apply reviewed patch

on:
  push:
    branches:
      - refactor/remove-napcat-onebot-runtime-20260802
    paths:
      - 'automation/ob-patches/**'
      - '.github/workflows/ob-apply-reviewed-patch.yml'
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

concurrency:
  group: ob-reviewed-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-napcat-onebot-runtime-20260802
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: onebot-plugin-groupguard/package-lock.json

      - name: Detect ready patch
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          if [ -f automation/ob-patches/current/READY ]; then
            echo 'value=true' >> "$GITHUB_OUTPUT"
          else
            echo 'value=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Decode and validate patch integrity
        if: steps.ready.outputs.value == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PATCH_DIR=automation/ob-patches/current
          test -f "$PATCH_DIR/MESSAGE"
          test -f "$PATCH_DIR/PATCH_SHA256"
          test -f "$PATCH_DIR/GZIP_SHA256"
          cp "$PATCH_DIR/MESSAGE" /tmp/ob-patch-message

          chunks=(000 001 002a 002b 003)
          sizes=(8000 8000 4000 4000 8080)
          : > /tmp/ob-reviewed.patch.gz.b64
          for index in "${!chunks[@]}"; do
            file="$PATCH_DIR/${chunks[$index]}.b64"
            expected="${sizes[$index]}"
            test -f "$file"
            actual="$(wc -c < "$file")"
            if [ "$actual" -lt "$expected" ]; then
              echo "Patch chunk ${chunks[$index]} is truncated: expected at least $expected bytes, got $actual" >&2
              exit 1
            fi
            head -c "$expected" "$file" >> /tmp/ob-reviewed.patch.gz.b64
          done

          test "$(wc -c < /tmp/ob-reviewed.patch.gz.b64)" -eq 32080
          base64 --decode /tmp/ob-reviewed.patch.gz.b64 > /tmp/ob-reviewed.patch.gz
          printf '%s  %s\n' "$(cat "$PATCH_DIR/GZIP_SHA256")" /tmp/ob-reviewed.patch.gz | sha256sum -c -
          gzip -dc /tmp/ob-reviewed.patch.gz > /tmp/ob-reviewed.patch
          test -s /tmp/ob-reviewed.patch
          printf '%s  %s\n' "$(cat "$PATCH_DIR/PATCH_SHA256")" /tmp/ob-reviewed.patch | sha256sum -c -
          git apply --check /tmp/ob-reviewed.patch
          git apply --index /tmp/ob-reviewed.patch
          git diff --cached --check

      - name: Install dependencies
        if: steps.ready.outputs.value == 'true'
        working-directory: onebot-plugin-groupguard
        run: npm ci

      - name: Run complete regression and dual builds
        if: steps.ready.outputs.value == 'true'
        working-directory: onebot-plugin-groupguard
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run build:onebot
          npm run build:snowluma

      - name: Commit reviewed patch
        if: steps.ready.outputs.value == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf automation/ob-patches/current
          git add -A
          git diff --cached --check
          git config user.name 'GroupGuard Refactor Bot'
          git config user.email 'groupguard-refactor@users.noreply.github.com'
          message="$(cat /tmp/ob-patch-message)"
          if [ -z "$message" ]; then message='refactor: apply reviewed patch'; fi
          git commit -m "$message"
          git push origin HEAD:refactor/remove-napcat-onebot-runtime-20260802
