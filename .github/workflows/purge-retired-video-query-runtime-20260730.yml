name: purge-retired-video-query-runtime-20260730

on:
  push:
    branches:
      - feat/all-query-intranet-client-20260729
    paths:
      - .github/workflows/purge-retired-video-query-runtime-20260730.yml

permissions:
  contents: write

jobs:
  purge-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/all-query-intranet-client-20260729
          fetch-depth: 0

      - name: Verify trigger commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: onebot-plugin-groupguard/package-lock.json

      - name: Install dependencies
        working-directory: onebot-plugin-groupguard
        run: npm ci

      - name: Apply exact purge
        id: purge
        shell: bash
        run: |
          set +e
          python .github/scripts/purge_retired_video_runtime_20260730.py > purge.log 2>&1
          code=$?
          cat purge.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run complete tests
        id: tests
        if: steps.purge.outputs.code == '0'
        shell: bash
        working-directory: onebot-plugin-groupguard
        run: |
          set +e
          npm test > ../tests.log 2>&1
          code=$?
          cat ../tests.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build release
        id: build
        if: steps.purge.outputs.code == '0' && steps.tests.outputs.code == '0'
        shell: bash
        working-directory: onebot-plugin-groupguard
        run: |
          set +e
          npm run build:release > ../build.log 2>&1
          code=$?
          cat ../build.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Scan source and dist
        id: scan
        if: steps.purge.outputs.code == '0' && steps.tests.outputs.code == '0' && steps.build.outputs.code == '0'
        shell: bash
        run: |
          set +e
          marker='我要看|设置看视频接口|删除看视频接口|看视频接口列表|videoApiTemplates|query\.video|video\.info|intranet_video_runtime_plugin|registerIntranetVideoCommandPlugins'
          code=0
          if grep -RInaE "$marker" onebot-plugin-groupguard/src onebot-plugin-groupguard/config; then
            echo 'Retired video-query marker remains in runtime source.' >&2
            code=1
          fi
          if find onebot-plugin-groupguard/dist -type f -iname '*video*' -print -quit | grep -q .; then
            echo 'Video-named file remains in dist.' >&2
            find onebot-plugin-groupguard/dist -type f -iname '*video*' -print >&2
            code=1
          fi
          if grep -RInaE "$marker" onebot-plugin-groupguard/dist; then
            echo 'Retired video-query marker remains in dist.' >&2
            code=1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit verified result
        shell: bash
        env:
          PURGE_CODE: ${{ steps.purge.outputs.code }}
          TEST_CODE: ${{ steps.tests.outputs.code }}
          BUILD_CODE: ${{ steps.build.outputs.code }}
          SCAN_CODE: ${{ steps.scan.outputs.code }}
        run: |
          set -euo pipefail
          purge="${PURGE_CODE:-99}"
          tests="${TEST_CODE:-99}"
          build="${BUILD_CODE:-99}"
          scan="${SCAN_CODE:-99}"
          status=failed
          if [ "$purge" = 0 ] && [ "$tests" = 0 ] && [ "$build" = 0 ] && [ "$scan" = 0 ]; then
            status=success
          else
            git reset --hard HEAD
          fi
          mkdir -p onebot-plugin-groupguard/docs/checkpoints
          cat > onebot-plugin-groupguard/docs/checkpoints/RETIRED_VIDEO_RUNTIME_PURGE_20260730.json <<JSON
          {
            "schema": "groupguard-retired-video-runtime-purge.v1",
            "status": "$status",
            "trigger_commit": "$GITHUB_SHA",
            "purge_exit": $purge,
            "tests_exit": $tests,
            "build_exit": $build,
            "scan_exit": $scan,
            "video_category": "retired",
            "runtime_markers_forbidden": true
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" = success ]; then
            git add -u onebot-plugin-groupguard
            git add onebot-plugin-groupguard/docs/checkpoints/RETIRED_VIDEO_RUNTIME_PURGE_20260730.json
            git commit -m "fix(query): purge retired video category runtime"
          else
            git add onebot-plugin-groupguard/docs/checkpoints/RETIRED_VIDEO_RUNTIME_PURGE_20260730.json
            git commit -m "docs(query): record failed retired-video purge"
          fi
          git push origin HEAD:feat/all-query-intranet-client-20260729
          test "$status" = success
