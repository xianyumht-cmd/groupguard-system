name: Temporary PR59 Enqueue Finalize

on:
  push:
    paths:
      - '.github/workflows/tmp-pr59-enqueue-finalize-20260910.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/per-group-self-recall-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: onebot-plugin-groupguard/package-lock.json
      - name: Apply durable admission fix
        run: python scripts/tmp_pr59_enqueue_finalize_20260910.py
      - name: Install dependencies
        working-directory: onebot-plugin-groupguard
        run: npm ci --no-audit --no-fund
      - name: Verify
        working-directory: onebot-plugin-groupguard
        run: |
          npm run verify:per-group-self-recall
          npm run typecheck
          npm run verify:action-queue
          npm test
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onebot-plugin-groupguard/src/services/action_queue_service.ts
          git add onebot-plugin-groupguard/scripts/test_per_group_self_recall_contract.mjs
          git add docs/PITFALLS.md
          git commit -m "fix: finalize durable self-recall admission failures"
          git push origin HEAD:feat/per-group-self-recall-20260910
