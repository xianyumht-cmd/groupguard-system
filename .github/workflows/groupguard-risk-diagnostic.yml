name: GroupGuard Risk Diagnostic

on:
  pull_request:
    branches:
      - feat/groupguard-shard-intranet-migration-20260729
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onebot-plugin-groupguard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: onebot-plugin-groupguard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Capture focused typecheck and risk verification
        shell: bash
        run: |
          set +e
          {
            echo '=== TYPECHECK ==='
            npm run typecheck
            echo "TYPECHECK_EXIT=$?"
            echo '=== RISK VERIFY ==='
            npm run verify:intranet-risk-command
            echo "RISK_EXIT=$?"
          } 2>&1 | tee risk-diagnostic.log
          exit 0

      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: groupguard-risk-diagnostic-${{ github.sha }}
          path: onebot-plugin-groupguard/risk-diagnostic.log
          if-no-files-found: error
          retention-days: 7
