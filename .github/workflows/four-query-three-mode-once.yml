name: Four query three-mode plugin once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'codex/four-query-three-mode-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: onebot-plugin-groupguard/package-lock.json
      - name: Wire all four queries to unified output preference
        shell: python
        run: |
          from pathlib import Path

          root = Path('onebot-plugin-groupguard')

          def read(path):
              return (root / path).read_text(encoding='utf-8')

          def write(path, text):
              (root / path).write_text(text, encoding='utf-8')

          service = read('src/services/intranet_query_service.ts')
          service = service.replace(
              "if (value === 'text' || value === 'image' || value === 'forward') return value;\n  return 'auto';",
              "if (value === 'text' || value === 'image' || value === 'forward') return value;\n  if (value === 'card') return 'image';\n  return 'auto';",
          )
          write('src/services/intranet_query_service.ts', service)

          query = read('src/dynamic-commands/intranet_query_runtime_plugin.ts')
          marker = '''export function resolveAramPreferredOutput(groupId: string): IntranetPreferredOutput {
  const config = configStateService.getConfig() as any;
  const group = configStateService.resolveGroupSettings(groupId) as any;
  if (group && Object.prototype.hasOwnProperty.call(group, 'aramQueryOutputFormat')) {
    return normalizeIntranetPreferredOutput(group.aramQueryOutputFormat);
  }
  const profileValue = config?.queryCommandProfiles?.lol_aram_augments?.outputFormat
    ?? config?.queryCommandProfiles?.aram?.outputFormat;
  if (profileValue !== undefined && profileValue !== '') return normalizeIntranetPreferredOutput(profileValue);
  return normalizeIntranetPreferredOutput(config?.aramQueryOutputFormat || 'image');
}
'''
          addition = marker + '''
export function resolveUnifiedQueryPreferredOutput(
  groupId: string,
  profileKeys: string[] = []
): IntranetPreferredOutput {
  const config = configStateService.getConfig() as any;
  for (const key of profileKeys) {
    const profileValue = config?.queryCommandProfiles?.[key]?.outputFormat;
    if (profileValue !== undefined && profileValue !== '') {
      return normalizeIntranetPreferredOutput(profileValue);
    }
  }
  const group = configStateService.resolveGroupSettings(groupId) as any;
  return normalizeIntranetPreferredOutput(
    group?.lolQueryOutputFormat
      ?? config?.global?.lolQueryOutputFormat
      ?? config?.lolQueryOutputFormat
      ?? 'text'
  );
}
'''
          if marker not in query:
              raise SystemExit('query resolver marker not found')
          query = query.replace(marker, addition)
          query = query.replace(
              "preferred: 'text',\n      timeoutMs: resolveIntranetQueryTimeoutMs(),\n      requestId: requestIdFromContext('lolban', input, context),",
              "preferred: resolveUnifiedQueryPreferredOutput(group.groupId, ['lol_ban', 'lolban']),\n      timeoutMs: resolveIntranetQueryTimeoutMs(),\n      requestId: requestIdFromContext('lolban', input, context),",
          )
          write('src/dynamic-commands/intranet_query_runtime_plugin.ts', query)

          risk = read('src/dynamic-commands/intranet_risk_runtime_plugin.ts')
          risk = risk.replace(
              '  buildIntranetStructuredResult,\n  resolveIntranetQueryTimeoutMs\n',
              '  buildIntranetStructuredResult,\n  resolveIntranetQueryTimeoutMs,\n  resolveUnifiedQueryPreferredOutput\n',
          )
          risk = risk.replace(
              "preferred: 'text',\n      timeoutMs: resolveIntranetQueryTimeoutMs(),\n      requestId: requestIdFromContext(category, input, context),",
              "preferred: resolveUnifiedQueryPreferredOutput(groupId, [category]),\n      timeoutMs: resolveIntranetQueryTimeoutMs(),\n      requestId: requestIdFromContext(category, input, context),",
              1,
          )
          write('src/dynamic-commands/intranet_risk_runtime_plugin.ts', risk)

          dynamic = read('src/dynamic-commands/intranet_dynamic_command_plugin.ts')
          dynamic = dynamic.replace(
              "import type { CommandPlugin } from './command_runtime_plugin';",
              "import type { CommandPlugin } from './command_runtime_plugin';\nimport { resolveUnifiedQueryPreferredOutput } from './intranet_query_runtime_plugin';",
          )
          dynamic = dynamic.replace(
              "preferred: 'text',\n      timeoutMs: timeoutMs(),",
              "preferred: resolveUnifiedQueryPreferredOutput(String(input.groupId || ''), [definition.id, 'dynamic']),\n      timeoutMs: timeoutMs(),",
          )
          write('src/dynamic-commands/intranet_dynamic_command_plugin.ts', dynamic)

          fast = read('scripts/verify-all-query-fast-migration.ts')
          fast = fast.replace(
              'banQueryUserCooldownSeconds: 0\n',
              "banQueryUserCooldownSeconds: 0,\n    lolQueryOutputFormat: 'image'\n",
          )
          fast = fast.replace(
              "assert.equal(payload.parameters.qq, '123456789');\n      return banEnvelope;",
              "assert.equal(payload.parameters.qq, '123456789');\n      assert.equal(payload.preferred, 'image');\n      return banEnvelope;",
          )
          write('scripts/verify-all-query-fast-migration.ts', fast)

          risk_test = read('scripts/verify-intranet-risk-command.ts')
          risk_test = risk_test.replace(
              'lolQueryGroupMinIntervalSeconds: 0\n',
              "lolQueryGroupMinIntervalSeconds: 0,\n    lolQueryOutputFormat: 'image'\n",
          )
          risk_test = risk_test.replace(
              "assert.equal(queryPayload.feature, 'scammer');\n",
              "assert.equal(queryPayload.feature, 'scammer');\n  assert.equal(queryPayload.preferred, 'image');\n",
          )
          write('scripts/verify-intranet-risk-command.ts', risk_test)

          dynamic_test = read('scripts/verify-intranet-dynamic-command.ts')
          dynamic_test = dynamic_test.replace(
              "config.global = { ...(config.global || {}), lolQueryRequestTimeoutSeconds: 20 };",
              "config.global = { ...(config.global || {}), lolQueryRequestTimeoutSeconds: 20, lolQueryOutputFormat: 'image' };",
          )
          dynamic_test = dynamic_test.replace(
              "assert.equal(sentPayload.feature, 'dynamic');\n",
              "assert.equal(sentPayload.feature, 'dynamic');\n  assert.equal(sentPayload.preferred, 'image');\n",
          )
          write('scripts/verify-intranet-dynamic-command.ts', dynamic_test)

          verify = r'''import assert from 'node:assert/strict';
import { readFile } from 'node:fs/promises';
import { configStateService } from '../src/core/state-services/config_state_service.ts';
import { resolveUnifiedQueryPreferredOutput } from '../src/dynamic-commands/intranet_query_runtime_plugin.ts';
import { normalizeIntranetPreferredOutput } from '../src/services/intranet_query_service.ts';

assert.equal(normalizeIntranetPreferredOutput('text'), 'text');
assert.equal(normalizeIntranetPreferredOutput('forward'), 'forward');
assert.equal(normalizeIntranetPreferredOutput('image'), 'image');
assert.equal(normalizeIntranetPreferredOutput('card'), 'image');

const original = structuredClone(configStateService.getConfig() as any);
try {
  for (const mode of ['text', 'forward', 'image'] as const) {
    const config = structuredClone(original) as any;
    config.global = { ...(config.global || {}), lolQueryOutputFormat: mode };
    config.groups = {};
    config.queryCommandProfiles = {};
    configStateService.setConfig(config);
    for (const keys of [['lol_ban'], ['scammer'], ['peer'], ['dynamic']]) {
      assert.equal(resolveUnifiedQueryPreferredOutput('10001', keys), mode);
    }
  }

  const config = structuredClone(original) as any;
  config.global = { ...(config.global || {}), lolQueryOutputFormat: 'text' };
  config.queryCommandProfiles = { scammer: { outputFormat: 'forward' } };
  configStateService.setConfig(config);
  assert.equal(resolveUnifiedQueryPreferredOutput('10001', ['scammer']), 'forward');
} finally {
  configStateService.setConfig(original as any);
}

for (const path of [
  'src/dynamic-commands/intranet_query_runtime_plugin.ts',
  'src/dynamic-commands/intranet_risk_runtime_plugin.ts',
  'src/dynamic-commands/intranet_dynamic_command_plugin.ts'
]) {
  const source = await readFile(new URL(`../${path}`, import.meta.url), 'utf8');
  assert.equal(source.includes("preferred: 'text'"), path.includes('intranet_risk_runtime_plugin') ? true : false);
}

console.log('four query three-mode preference verification passed');
'''
          write('scripts/verify-four-query-three-mode.ts', verify)

          package_path = root / 'package.json'
          package_text = package_path.read_text(encoding='utf-8')
          package_text = package_text.replace(
              '"verify:intranet-dynamic-command": "node --experimental-strip-types --import ./scripts/register-ts-loader.mjs scripts/verify-intranet-dynamic-command.ts",',
              '"verify:intranet-dynamic-command": "node --experimental-strip-types --import ./scripts/register-ts-loader.mjs scripts/verify-intranet-dynamic-command.ts",\n    "verify:four-query-three-mode": "node --experimental-strip-types --import ./scripts/register-ts-loader.mjs scripts/verify-four-query-three-mode.ts",',
          )
          package_text = package_text.replace(
              'npm run verify:intranet-dynamic-command && npm run verify:all-query-client-boundary',
              'npm run verify:intranet-dynamic-command && npm run verify:four-query-three-mode && npm run verify:all-query-client-boundary',
          )
          package_path.write_text(package_text, encoding='utf-8')

          for directory in ['src', 'webui', 'public']:
            base = root / directory
            if not base.exists():
              continue
            for path in base.rglob('*'):
              if path.is_file() and path.suffix.lower() in {'.ts', '.tsx', '.js', '.jsx', '.vue', '.html'}:
                text = path.read_text(encoding='utf-8')
                updated = text.replace('战绩查询输出格式', '查询结果格式')
                if updated != text:
                  path.write_text(updated, encoding='utf-8')
      - name: Verify and build
        working-directory: onebot-plugin-groupguard
        run: |
          npm ci
          npm test
          npm run build:snowluma
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/four-query-three-mode-once.yml
          git add -A
          git commit -m "feat(query): enable three delivery modes for four queries"
          git push origin HEAD:codex/four-query-three-mode-20260730
