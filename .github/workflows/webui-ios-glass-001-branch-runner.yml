name: WEBUI-IOS-001 branch runner

on:
  push:
    branches: [codex/webui-ios-glass-20260730]

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message == 'chore(webui): trigger WEBUI-IOS-001 implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/webui-ios-glass-20260730
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: onebot-plugin-groupguard/package-lock.json

      - name: Execute reviewed implementation block
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          subprocess.run(['git', 'fetch', 'origin', 'main'], check=True)
          workflow = subprocess.check_output(
              ['git', 'show', 'origin/main:.github/workflows/webui-ios-glass-001-runner.yml'],
              text=True,
              encoding='utf-8',
          )
          lines = workflow.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == '- name: Connect shared theme and align query WebUI')
          run_index = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
          block = []
          for line in lines[run_index + 1:]:
              if line.startswith('      - name:'):
                  break
              block.append(line[10:] if line.startswith('          ') else line)
          code = '\n'.join(block)
          Path('.webui-ios-001-implementation.py').write_text(code, encoding='utf-8')
          exec(compile(code, '.webui-ios-001-implementation.py', 'exec'), {'__name__': '__main__'})

      - name: Verify complete plugin and SnowLuma build
        working-directory: onebot-plugin-groupguard
        run: |
          npm ci
          npm test
          npm run build:snowluma

      - name: Commit verified implementation and remove runner
        shell: bash
        run: |
          set -euo pipefail
          rm -f .webui-ios-001-implementation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/webui-ios-glass-001-branch-runner.yml docs/WEBUI_IOS_GLASS_001_TRIGGER.txt
          git add onebot-plugin-groupguard/src/standalone/admin/server.ts \
                  onebot-plugin-groupguard/src/standalone/admin/query_api.ts \
                  onebot-plugin-groupguard/src/standalone/admin/query_page.ts \
                  onebot-plugin-groupguard/package.json \
                  docs/WEBUI_IOS_GLASS_001_STATE.json
          git commit -m "feat(webui): connect shared theme and align query settings"
          git push origin HEAD:codex/webui-ios-glass-20260730
