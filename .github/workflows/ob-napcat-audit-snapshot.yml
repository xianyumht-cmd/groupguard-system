name: OB NapCat dependency audit snapshot

on:
  push:
    branches:
      - refactor/remove-napcat-onebot-runtime-20260802
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build read-only audit snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ob-audit
          git rev-parse HEAD > ob-audit/head.txt
          git status --short --branch > ob-audit/git-status.txt
          git ls-files | LC_ALL=C sort > ob-audit/tracked-files.txt
          git archive --format=tar.gz --output=ob-audit/repository.tar.gz HEAD

          if command -v rg >/dev/null 2>&1; then
            rg -n --hidden --glob '!.git/**' --glob '!**/node_modules/**' --glob '!**/dist/**' \
              -i 'napcat|pluginManager|NapCatConfig|PluginModule|OB11Message|adapterName|networkConfig|build:napcat' \
              . > ob-audit/napcat-bindings.txt || true
            rg -n --hidden --glob '!.git/**' --glob '!**/node_modules/**' --glob '!**/dist/**' \
              'actions\.call|rawCall|callAction|delete_group_file|get_group_root_files|get_group_files_by_folder|get_group_file_url|upload_group_file|get_group_msg_history' \
              onebot-plugin-groupguard > ob-audit/action-and-extension-calls.txt || true
            rg -n --hidden --glob '!.git/**' --glob '!**/node_modules/**' --glob '!**/dist/**' \
              "from ['\"]napcat-types|require\(['\"]napcat-types" \
              onebot-plugin-groupguard > ob-audit/napcat-imports.txt || true
          else
            grep -RInE 'napcat|pluginManager|NapCatConfig|PluginModule|OB11Message|adapterName|networkConfig|build:napcat' \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist . > ob-audit/napcat-bindings.txt || true
            grep -RInE 'actions\.call|rawCall|callAction|delete_group_file|get_group_root_files|get_group_files_by_folder|get_group_file_url|upload_group_file|get_group_msg_history' \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist onebot-plugin-groupguard > ob-audit/action-and-extension-calls.txt || true
            grep -RInE "from ['\"]napcat-types|require\(['\"]napcat-types" \
              --exclude-dir=node_modules --exclude-dir=dist onebot-plugin-groupguard > ob-audit/napcat-imports.txt || true
          fi

          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const pkgPaths = ['package.json', 'onebot-plugin-groupguard/package.json'];
          const packages = {};
          for (const rel of pkgPaths) {
            packages[rel] = JSON.parse(fs.readFileSync(path.join(root, rel), 'utf8'));
          }
          fs.writeFileSync('ob-audit/package-scripts.json', JSON.stringify(packages, null, 2));
          NODE

      - name: Upload audit snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ob-napcat-audit-snapshot
          path: ob-audit
          if-no-files-found: error
          retention-days: 7
