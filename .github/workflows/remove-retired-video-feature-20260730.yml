name: one-shot remove retired GroupGuard video feature

on:
  push:
    branches:
      - feat/all-query-intranet-client-20260729
    paths:
      - onebot-plugin-groupguard/scripts/remove-retired-video-feature-20260730.mjs
      - .github/workflows/remove-retired-video-feature-20260730.yml

permissions:
  contents: write

jobs:
  migrate-test-build-commit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: onebot-plugin-groupguard
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/all-query-intranet-client-20260729
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: onebot-plugin-groupguard/package-lock.json

      - name: Apply asserted video retirement migration
        run: node scripts/remove-retired-video-feature-20260730.mjs

      - name: Install exact dependencies
        run: npm ci

      - name: Run complete test suite
        run: npm test

      - name: Build SnowLuma dist
        run: npm run build:snowluma

      - name: Verify removed runtime surface
        run: |
          test ! -e src/dynamic-commands/intranet_video_runtime_plugin.ts
          test ! -e scripts/verify-intranet-video-command.ts
          test -e scripts/verify-video-retired.ts
          ! grep -R "registerIntranetVideoCommandPlugins\|intranet_video_runtime_plugin" src/commands.ts
          ! grep -R '"video.info"\|"我要看"\|"视频 "' config/dynamic-commands/commands.json
          npm run verify:video-retired
          npm run verify:all-query-client-boundary

      - name: Remove one-shot machinery and commit verified result
        working-directory: .
        run: |
          rm -f onebot-plugin-groupguard/scripts/remove-retired-video-feature-20260730.mjs
          rm -f .github/workflows/remove-retired-video-feature-20260730.yml
          git config user.name 'openai-gpt-5.6-thinking'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(query): retire video commands from GroupGuard'
          git push origin HEAD:feat/all-query-intranet-client-20260729
