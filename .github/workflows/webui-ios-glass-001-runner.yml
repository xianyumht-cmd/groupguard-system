name: WEBUI-IOS-001 temporary runner

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

jobs:
  implement:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 25 &&
      github.event.comment.user.login == 'xianyumht-cmd' &&
      github.event.comment.body == '/run-webui-ios-001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/webui-ios-glass-20260730
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: onebot-plugin-groupguard/package-lock.json

      - name: Connect shared theme and align query WebUI
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('onebot-plugin-groupguard')

          def read(path):
              return (root / path).read_text(encoding='utf-8')

          def write(path, value):
              (root / path).write_text(value, encoding='utf-8')

          def replace_once(source, old, new, label):
              if old not in source:
                  raise SystemExit(f'{label} marker not found')
              return source.replace(old, new, 1)

          # Every standalone page is themed at the server boundary so all pages
          # share the same storage key and appearance without duplicating CSS.
          server = read('src/standalone/admin/server.ts')
          import_marker = "import { renderGroupFileMirrorPage } from './group_file_mirror_page';"
          if "import { applyWebUiTheme } from './webui_theme';" not in server:
              server = replace_once(
                  server,
                  import_marker,
                  import_marker + "\nimport { applyWebUiTheme } from './webui_theme';",
                  'server theme import',
              )
          replacements = {
              "send(res, 200, renderMainPage(), 'text/html; charset=utf-8');": "send(res, 200, applyWebUiTheme(renderMainPage()), 'text/html; charset=utf-8');",
              "send(res, 200, renderQaPage(), 'text/html; charset=utf-8');": "send(res, 200, applyWebUiTheme(renderQaPage()), 'text/html; charset=utf-8');",
              "send(res, 200, renderQueryPage(), 'text/html; charset=utf-8');": "send(res, 200, applyWebUiTheme(renderQueryPage()), 'text/html; charset=utf-8');",
              "send(res, 200, renderQunGuanjiaPage(), 'text/html; charset=utf-8');": "send(res, 200, applyWebUiTheme(renderQunGuanjiaPage()), 'text/html; charset=utf-8');",
              "send(res, 200, renderGroupFileMirrorPage(), 'text/html; charset=utf-8');": "send(res, 200, applyWebUiTheme(renderGroupFileMirrorPage()), 'text/html; charset=utf-8');",
          }
          for old, new in replacements.items():
              if new not in server:
                  server = replace_once(server, old, new, old)
          write('src/standalone/admin/server.ts', server)

          # Remove the retired hidden-query control surface and make overview
          # defaults follow the unified query delivery preference.
          api = read('src/standalone/admin/query_api.ts')
          api = api.replace(
              "type QueryType = 'lol_ban' | 'lol_battle' | 'lol_hidden' | 'lol_shard' | 'lol_aram_augments' | 'scammer' | 'peer' | 'ele_build' | 'custom';",
              "type QueryType = 'lol_ban' | 'lol_battle' | 'lol_shard' | 'lol_aram_augments' | 'scammer' | 'peer' | 'ele_build' | 'dynamic' | 'custom';",
          )
          api = api.replace(
              "  'lol_ban', 'lol_battle', 'lol_hidden', 'lol_shard', 'lol_aram_augments',\n  'scammer', 'peer', 'ele_build', 'custom'",
              "  'lol_ban', 'lol_battle', 'lol_shard', 'lol_aram_augments',\n  'scammer', 'peer', 'ele_build', 'custom'",
          )
          api = api.replace(
              "  { type: 'lol_hidden', name: '查隐藏', trigger: '查隐藏', featureKey: 'query.lol_hidden', dataSource: 'local-api' },\n",
              "",
          )
          api = api.replace(
              "  { type: 'scammer', name: '骗子查询', trigger: '查骗子', featureKey: 'query.scammer', dataSource: 'external' },",
              "  { type: 'scammer', name: '骗子查询', trigger: '查骗子', featureKey: 'query.scammer', dataSource: 'local-api' },",
          )
          api = api.replace(
              "  { type: 'peer', name: '同行查询', trigger: '查同行', featureKey: 'query.peer', dataSource: 'local-db' },",
              "  { type: 'peer', name: '同行查询', trigger: '查同行', featureKey: 'query.peer', dataSource: 'local-api' },",
          )
          api = api.replace(
              "  { type: 'ele_build', name: 'ELE下载', trigger: 'ELE下载', featureKey: 'dynamic.ele_build', dataSource: 'external' }",
              "  { type: 'ele_build', name: 'ELE下载', trigger: 'ELE下载', featureKey: 'dynamic.ele_build', dataSource: 'external' },\n  { type: 'dynamic', name: '动态查询默认', trigger: '动态命令', featureKey: 'dynamic', dataSource: 'local-api' }",
          )
          old_default = """function defaultOutputFor(config: any, global: any, type: QueryType): string {
  if (type === 'lol_shard' || type === 'lol_aram_augments') return 'image';
  if (type === 'lol_ban' || type === 'scammer' || type === 'peer' || type === 'ele_build') return 'text';
  return global.lolQueryOutputFormat || 'forward';
}"""
          new_default = """function defaultOutputFor(config: any, global: any, type: QueryType): string {
  if (type === 'lol_shard' || type === 'lol_aram_augments') return 'image';
  return global.lolQueryOutputFormat || 'forward';
}"""
          if new_default not in api:
              api = replace_once(api, old_default, new_default, 'query default output')
          api = api.replace("  if (type === 'lol_hidden') return config.lolApiBaseUrl || config.lolQueryUrl || '';\n", "")
          api = api.replace(
              "  if (type === 'scammer') return Array.isArray(config.scammerQueryUrls) ? config.scammerQueryUrls[0] || '' : '';\n  if (type === 'peer') return '本地数据库';",
              "  if (type === 'scammer' || type === 'peer' || type === 'dynamic') return config.lolApiBaseUrl || '';",
          )
          api = api.replace("  if (type === 'lol_hidden') return baseEnabled && enabledSwitch(featureSwitches, 'query.lol_hidden') && commandSwitch.hiddenQuery !== false;\n", "")
          api = api.replace(
              "  if (type === 'ele_build') return global.masterEnabled !== false && global.queryEnabled !== false && global.dynamicCommandEnabled !== false;\n  return false;",
              "  if (type === 'ele_build' || type === 'dynamic') return global.masterEnabled !== false && global.queryEnabled !== false && global.dynamicCommandEnabled !== false;\n  return false;",
          )
          api = api.replace("  warnings.push(...validateUrlValue('战绩查询 URL', config.lolQueryUrl, false));\n", "")
          api = api.replace("      lolQueryUrl: config.lolQueryUrl || '',\n", "")
          hidden_branch = """  if (type === 'lol_hidden') {
    let url = replaceTemplate(config.lolQueryUrl || '', param, { type });
    if (!url) throw new Error('未配置 lolQueryUrl');
    if (!/[?&](qq|uin|account|name)=/.test(url) && !url.includes('{') && !url.includes('$')) url = addQueryParam(url, 'name', param);
    if (config.lolAuthKey && !/[?&](key|auth|zhanjikey|token)=/.test(url)) url = addQueryParam(url, 'zhanjikey', config.lolAuthKey);
    return url;
  }
"""
          api = api.replace(hidden_branch, '')
          if 'lol_hidden' in api or '查隐藏' in api:
              raise SystemExit('retired hidden query remains in query_api.ts')
          write('src/standalone/admin/query_api.ts', api)

          page = read('src/standalone/admin/query_page.ts')
          page = page.replace(
              '骗子查询走外部接口；同行查询走本地数据库；这里用于配置、校验和测试。',
              '查询统一请求内网接口；这里用于配置全局、分群和单命令输出偏好，并进行安全测试。',
          )
          page = page.replace(
              '优先级：单命令配置 > 分群配置 > 全局配置。当前先保存 WebUI 配置，下一步再接入真实查询发送链路。',
              '优先级：单命令配置 > 分群配置 > 全局配置。插件只提交输出偏好，接口端生成最终文字、合并转发或图片。',
          )
          page = page.replace('<option value="lol_hidden">查隐藏</option>', '')
          page = page.replace(
              "var types=['lol_ban','lol_battle','lol_hidden','lol_shard','lol_aram_augments','scammer','peer','ele_build'];",
              "var types=['lol_ban','lol_battle','lol_shard','lol_aram_augments','scammer','peer','dynamic','ele_build'];",
          )
          page = page.replace(
              "var names={lol_ban:'查封号',lol_battle:'查战绩',lol_hidden:'查隐藏',lol_shard:'查合集',lol_aram_augments:'海符榜',scammer:'骗子查询',peer:'同行查询',ele_build:'ELE下载'};",
              "var names={lol_ban:'查封号',lol_battle:'查战绩',lol_shard:'查合集',lol_aram_augments:'海符榜',scammer:'骗子查询',peer:'同行查询',dynamic:'动态查询默认',ele_build:'ELE下载'};",
          )
          page = page.replace(
              "var triggers={lol_ban:'查封号',lol_battle:'查战绩',lol_hidden:'查隐藏',lol_shard:'查合集',lol_aram_augments:'海符榜',scammer:'查骗子',peer:'查同行',ele_build:'ELE下载'};",
              "var triggers={lol_ban:'查封号',lol_battle:'查战绩',lol_shard:'查合集',lol_aram_augments:'海符榜',scammer:'查骗子',peer:'查同行',dynamic:'动态命令',ele_build:'ELE下载'};",
          )
          page = page.replace(
              "var sources={lol_ban:'local-api',lol_battle:'local-api',lol_hidden:'local-api',lol_shard:'remote-json',lol_aram_augments:'local-api',scammer:'external',peer:'local-db',ele_build:'external'};",
              "var sources={lol_ban:'内网接口',lol_battle:'内网接口',lol_shard:'内网接口',lol_aram_augments:'内网接口',scammer:'内网接口',peer:'内网接口',dynamic:'内网接口',ele_build:'构建接口'};",
          )
          old_out = "function commandOut(type,s){var g=currentGroupData&&currentGroupData.group||{};var profiles=currentOverview&&currentOverview.profiles||{};var p=profiles[type]||{};if(type==='lol_shard'){if(g.shardQueryOutputFormat!==undefined)return g.shardQueryOutputFormat;if(p.outputFormat)return p.outputFormat;return s.shardQueryOutputFormat||get(currentOverview,'config.shardQueryOutputFormat','image')}if(type==='lol_aram_augments')return 'image';if(type==='lol_ban'||type==='scammer'||type==='peer'||type==='ele_build')return 'text';if(g.lolQueryOutputFormat!==undefined)return g.lolQueryOutputFormat;if(p.outputFormat)return p.outputFormat;return s.lolQueryOutputFormat||get(currentOverview,'base.defaultOutputFormat','forward')}"
          new_out = "function commandOut(type,s){var g=currentGroupData&&currentGroupData.group||{};var profiles=currentOverview&&currentOverview.profiles||{};var p=profiles[type]||{};if(p.outputFormat)return p.outputFormat;if(type==='lol_shard'){if(g.shardQueryOutputFormat!==undefined)return g.shardQueryOutputFormat;return s.shardQueryOutputFormat||get(currentOverview,'config.shardQueryOutputFormat','image')}if(type==='lol_aram_augments')return 'image';if(g.lolQueryOutputFormat!==undefined)return g.lolQueryOutputFormat;return s.lolQueryOutputFormat||get(currentOverview,'base.defaultOutputFormat','forward')}"
          if new_out not in page:
              page = replace_once(page, old_out, new_out, 'query page commandOut')
          old_enabled = "function commandEnabled(type,s){var fs=s.featureSwitches||{};var cs=s.lolQueryCommandSwitch||{};var profiles=currentOverview&&currentOverview.profiles||{};if((profiles[type]||{}).enabled===false)return false;var base=s.masterEnabled!==false&&s.queryEnabled!==false&&s.disableLolQuery!==true;if(type==='lol_ban')return base&&enabledSwitch(fs,'query.lol_ban')&&cs.banQuery!==false;if(type==='lol_battle')return base&&enabledSwitch(fs,'query.lol_battle')&&cs.battleQuery!==false;if(type==='lol_hidden')return base&&enabledSwitch(fs,'query.lol_hidden')&&cs.hiddenQuery!==false;if(type==='lol_shard')return base&&enabledSwitch(fs,'query.lol_shard');if(type==='lol_aram_augments')return base&&enabledSwitch(fs,'query.lol_aram_augments');if(type==='scammer')return s.masterEnabled!==false&&s.queryEnabled!==false&&enabledSwitch(fs,'query.scammer');if(type==='peer')return s.masterEnabled!==false&&s.queryEnabled!==false&&enabledSwitch(fs,'query.peer');if(type==='ele_build')return s.masterEnabled!==false&&s.queryEnabled!==false&&s.dynamicCommandEnabled!==false;return false}"
          new_enabled = "function commandEnabled(type,s){var fs=s.featureSwitches||{};var cs=s.lolQueryCommandSwitch||{};var profiles=currentOverview&&currentOverview.profiles||{};if((profiles[type]||{}).enabled===false)return false;var base=s.masterEnabled!==false&&s.queryEnabled!==false&&s.disableLolQuery!==true;if(type==='lol_ban')return base&&enabledSwitch(fs,'query.lol_ban')&&cs.banQuery!==false;if(type==='lol_battle')return base&&enabledSwitch(fs,'query.lol_battle')&&cs.battleQuery!==false;if(type==='lol_shard')return base&&enabledSwitch(fs,'query.lol_shard');if(type==='lol_aram_augments')return base&&enabledSwitch(fs,'query.lol_aram_augments');if(type==='scammer')return base&&enabledSwitch(fs,'query.scammer');if(type==='peer')return base&&enabledSwitch(fs,'query.peer');if(type==='dynamic'||type==='ele_build')return s.masterEnabled!==false&&s.queryEnabled!==false&&s.dynamicCommandEnabled!==false;return false}"
          if new_enabled not in page:
              page = replace_once(page, old_enabled, new_enabled, 'query page commandEnabled')
          page = page.replace("['text','image','forward','card']", "['text','forward','image']")
          page = page.replace("+sw('查隐藏','global.featureSwitches.query.lol_hidden',fs['query.lol_hidden']!==false)", '')
          page = page.replace("+sw('hiddenQuery','global.lolQueryCommandSwitch.hiddenQuery',cs.hiddenQuery!==false)", '')
          page = page.replace("+gsw('查隐藏','featureSwitches.query.lol_hidden',gs['query.lol_hidden']!==undefined?gs['query.lol_hidden']:es['query.lol_hidden']!==false)", '')
          page = page.replace("+gsw('hiddenQuery','lolQueryCommandSwitch.hiddenQuery',gcs.hiddenQuery!==undefined?gcs.hiddenQuery:ecs.hiddenQuery!==false)", '')
          page = page.replace(
              "+sw('查询总开关','global.queryEnabled',b.queryEnabled)",
              "+sw('查询总开关','global.queryEnabled',b.queryEnabled)+sw('动态查询/命令','global.dynamicCommandEnabled',b.dynamicCommandEnabled!==false)",
          )
          page = page.replace(
              "sel('默认战绩输出','global.lolQueryOutputFormat',b.defaultOutputFormat,['forward','text','image','card'])",
              "sel('统一查询结果格式','global.lolQueryOutputFormat',b.defaultOutputFormat,['text','forward','image'])",
          )
          page = page.replace(
              "gsel('本群战绩输出','lolQueryOutputFormat',g.lolQueryOutputFormat||e.lolQueryOutputFormat||get(currentOverview,'base.defaultOutputFormat','image'),['forward','text','image','card'])",
              "gsel('本群统一查询结果格式','lolQueryOutputFormat',g.lolQueryOutputFormat||e.lolQueryOutputFormat||get(currentOverview,'base.defaultOutputFormat','forward'),['text','forward','image'])",
          )
          page = page.replace("+inp('隐藏战绩兼容 URL','lolQueryUrl',c.lolQueryUrl||'')", '')
          page = page.replace('同行查询不在这里配置 URL，它走本地数据库。', '骗子和同行查询均通过 LOL API Base 的统一内网交付接口。下方旧 URL 仅用于兼容迁移。')
          page = page.replace("(t==='peer'?'本地数据库':t==='scammer'?'外部骗子接口':'')", "(sources[t]||'')")
          if 'lol_hidden' in page or '查隐藏' in page:
              raise SystemExit('retired hidden query remains in query_page.ts')
          if "dynamic:'动态查询默认'" not in page:
              raise SystemExit('dynamic query profile missing from query_page.ts')
          write('src/standalone/admin/query_page.ts', page)

          package_path = root / 'package.json'
          package_text = package_path.read_text(encoding='utf-8')
          script_marker = '    "verify:four-query-three-mode": "node --experimental-strip-types --import ./scripts/register-ts-loader.mjs scripts/verify-four-query-three-mode.ts",\n'
          script_line = '    "verify:webui-ios-glass": "node --experimental-strip-types --import ./scripts/register-ts-loader.mjs scripts/verify-webui-ios-glass.ts",\n'
          if script_line not in package_text:
              package_text = replace_once(package_text, script_marker, script_marker + script_line, 'package verifier script')
          package_text = package_text.replace(
              'npm run verify:four-query-three-mode && npm run verify:all-query-client-boundary',
              'npm run verify:four-query-three-mode && npm run verify:webui-ios-glass && npm run verify:all-query-client-boundary',
          )
          package_path.write_text(package_text, encoding='utf-8')

          state_path = Path('docs/WEBUI_IOS_GLASS_001_STATE.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['progress_percent'] = 65
          state['updated_at'] = '2026-07-30T22:20:00+08:00'
          state['current_step'] = 'Run full GroupGuard CI and SnowLuma build'
          state['phases']['implementation'] = 'COMPLETED'
          state['phases']['verification'] = 'IN_PROGRESS'
          state['completed'].extend([
              'Added shared iOS glass theme module',
              'Injected theme into every standalone admin page',
              'Removed retired hidden-query WebUI controls',
              'Aligned query profiles with text, forward and image preferences'
          ])
          state['remaining'] = [
              'Run full CI and SnowLuma build',
              'Merge to main and mark COMPLETED'
          ]
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

      - name: Verify complete plugin and SnowLuma build
        working-directory: onebot-plugin-groupguard
        run: |
          npm ci
          npm test
          npm run build:snowluma

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onebot-plugin-groupguard/src/standalone/admin/server.ts \
                  onebot-plugin-groupguard/src/standalone/admin/query_api.ts \
                  onebot-plugin-groupguard/src/standalone/admin/query_page.ts \
                  onebot-plugin-groupguard/package.json \
                  docs/WEBUI_IOS_GLASS_001_STATE.json
          git commit -m "feat(webui): connect shared theme and align query settings"
          git push origin HEAD:codex/webui-ios-glass-20260730
