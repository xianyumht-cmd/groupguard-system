name: Hidden retirement cleanup once

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'codex/retire-hidden-query-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: onebot-plugin-groupguard/package-lock.json
      - name: Remove hidden query configuration and legacy runtime
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('onebot-plugin-groupguard')

          def load(relative):
              return (root / relative).read_text(encoding='utf-8')

          def save(relative, text):
              (root / relative).write_text(text, encoding='utf-8')

          types = load('src/types.ts')
          types = re.sub(r'^\s*hiddenQuery:\s*boolean;\s*\n', '', types, flags=re.M)
          save('src/types.ts', types)

          config = load('src/config.ts')
          config = re.sub(r'^\s*hiddenQuery:\s*true,?\s*\n', '', config, flags=re.M)
          config = re.sub(r'^\s*hiddenQuery:\s*\(switchInput as any\)\.hiddenQuery !== false,?\s*\n', '', config, flags=re.M)
          save('src/config.ts', config)

          interaction = load('src/services/interaction_service.ts')
          interaction = interaction.replace("  '查隐藏',\n", '')
          interaction = interaction.replace(
              "type QueryCommandType = 'lol_battle' | 'lol_hidden' | 'lol_shard';",
              "type QueryCommandType = 'lol_battle' | 'lol_shard';",
          )
          interaction = re.sub(r'\ninterface LolHiddenData \{.*?\n\}\n', '\n', interaction, flags=re.S)
          interaction = interaction.replace(
              "type LolCommandKey = 'battleQuery' | 'banQuery' | 'hiddenQuery';",
              "type LolCommandKey = 'battleQuery' | 'banQuery';",
          )
          interaction = re.sub(r'^\s*hiddenQuery:\s*\(data as any\)\.hiddenQuery !== false,?\s*\n', '', interaction, flags=re.M)
          interaction = re.sub(r'^\s*hiddenQuery:\s*true,?\s*\n', '', interaction, flags=re.M)
          interaction = re.sub(r'^\s*查隐藏:\s*\'hiddenQuery\',?\s*\n', '', interaction, flags=re.M)
          interaction = interaction.replace('仅支持：查战绩、查封号、查隐藏', '仅支持：查战绩、查封号')
          interaction = interaction.replace(" / 查隐藏(${switches.hiddenQuery ? '开' : '关'})", '')
          start = interaction.find("  if (text.startsWith('查隐藏')) {")
          end = interaction.find("  if (text === '邀请查询') {", start)
          if start < 0 or end < 0:
              raise SystemExit('legacy hidden query block markers not found')
          interaction = interaction[:start] + interaction[end:]
          save('src/services/interaction_service.ts', interaction)

          guard = load('scripts/verify-hidden-retired.ts')
          extra = """
          const typesSource = readFileSync(path.join(root, 'src/types.ts'), 'utf8');
          const configSource = readFileSync(path.join(root, 'src/config.ts'), 'utf8');
          const interactionSource = readFileSync(path.join(root, 'src/services/interaction_service.ts'), 'utf8');
          for (const source of [typesSource, configSource, interactionSource]) {
            assert.equal(source.includes('hiddenQuery'), false);
            assert.equal(source.includes('query.lol_hidden'), false);
            assert.equal(source.includes("text.startsWith('查隐藏')"), false);
          }
          """
          marker = "console.log('hidden query retirement verification passed');"
          if marker not in guard:
              raise SystemExit('retirement guard marker missing')
          extra = '\n'.join(line[10:] if line.startswith('          ') else line for line in extra.splitlines()).strip()
          guard = guard.replace(marker, f"{extra}\n\n{marker}")
          save('scripts/verify-hidden-retired.ts', guard)

      - name: Install and verify
        working-directory: onebot-plugin-groupguard
        run: |
          npm ci
          npm test
      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/hidden-retirement-cleanup-once.yml
          git add -A
          git commit -m "refactor(query): purge hidden query legacy configuration [hidden-cleanup-bot]"
          git push origin HEAD:codex/retire-hidden-query-20260730
