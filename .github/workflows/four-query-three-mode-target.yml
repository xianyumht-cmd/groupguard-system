name: Four query three-mode plugin target runner

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'codex/four-query-three-mode-20260730'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: onebot-plugin-groupguard/package-lock.json
      - name: Execute implementation block from reviewed branch workflow
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/four-query-three-mode-once.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == '- name: Wire all four queries to unified output preference')
          run_index = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
          block = []
          for line in lines[run_index + 1:]:
              if line.startswith('      - name:'):
                  break
              block.append(line[10:] if line.startswith('          ') else line)
          code = '\n'.join(block)
          exec(compile(code, str(path), 'exec'), {'__name__': '__main__'})
      - name: Verify complete plugin suite and SnowLuma build
        working-directory: onebot-plugin-groupguard
        run: |
          npm ci
          npm test
          npm run build:snowluma
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/four-query-three-mode-once.yml
          rm -f docs/four-query-three-mode.trigger docs/four-query-three-mode.trigger2 docs/four-query-three-mode.trigger3
          git add -A
          git commit -m "feat(query): enable three delivery modes for four queries"
          git push origin HEAD:codex/four-query-three-mode-20260730
