name: WebUI Browser Acceptance

on:
  pull_request:
    paths:
      - 'onebot-plugin-groupguard/src/standalone/admin/**'
      - 'onebot-plugin-groupguard/scripts/webui-browser-acceptance.spec.ts'
      - 'onebot-plugin-groupguard/scripts/webui-visual-polish.spec.ts'
      - 'onebot-plugin-groupguard/scripts/config-maturity-browser.spec.ts'
      - 'onebot-plugin-groupguard/tsconfig.browser-tests.json'
      - 'onebot-plugin-groupguard/tsconfig.json'
      - '.github/workflows/webui-browser-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: onebot-plugin-groupguard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: onebot-plugin-groupguard/package-lock.json

      - name: Install project dependencies
        run: npm ci

      - name: Install browser test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Typecheck browser acceptance scripts
        run: npx tsc -p tsconfig.browser-tests.json --noEmit

      # GitHub's Ubuntu mirror can stall for many minutes during `--with-deps`.
      # The hosted ubuntu-24.04 image already carries the shared libraries needed
      # by headless Chromium, so only fetch the pinned browser binary here.
      - name: Install Chromium browser binary
        run: npx playwright install chromium

      - name: Run desktop, mobile, and config-maturity browser acceptance
        run: npx playwright test scripts/webui-browser-acceptance.spec.ts scripts/webui-visual-polish.spec.ts scripts/config-maturity-browser.spec.ts --reporter=line --workers=1

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webui-browser-acceptance-evidence
          path: onebot-plugin-groupguard/test-results/
          if-no-files-found: warn
          retention-days: 30
