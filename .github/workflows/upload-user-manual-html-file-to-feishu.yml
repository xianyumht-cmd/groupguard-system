name: Build and upload HTML manual to Feishu Drive

on:
  push:
    branches:
      - main
    paths:
      - USER_MANUAL.md
      - USER_MANUAL.html
      - scripts/build_user_manual_html.py
      - scripts/upload_user_manual_html_file_to_feishu.py
      - .github/workflows/upload-user-manual-html-file-to-feishu.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feishu-raw-html-file-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static glass HTML from Markdown
        run: python scripts/build_user_manual_html.py

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Upload USER_MANUAL.html as raw file
        id: raw_upload
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_HTML_FOLDER_TOKEN: ${{ secrets.FEISHU_HTML_FOLDER_TOKEN }}
          FEISHU_TENANT_DOMAIN: tcnnh75d6cqg.feishu.cn
        run: |
          set -o pipefail
          python scripts/upload_user_manual_html_file_to_feishu.py 2>&1 | tee /tmp/feishu-raw-html.log

      - name: Write upload status
        if: always()
        env:
          UPLOAD_OUTCOME: ${{ steps.raw_upload.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          log_path = Path('/tmp/feishu-raw-html.log')
          log = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else '未生成执行日志。'
          log = re.sub(
              r'(?i)(app_secret|tenant_access_token|authorization)(["\':=\s]+)[^,\s"}]+',
              r'\1\2[REDACTED]',
              log,
          )[-8000:]

          result = {}
          start = log.rfind('{')
          while start >= 0:
              try:
                  result = json.loads(log[start:])
                  break
              except Exception:
                  start = log.rfind('{', 0, start)

          outcome = os.environ.get('UPLOAD_OUTCOME', 'unknown')
          ok = outcome == 'success' and bool(result.get('ok'))
          status = '成功' if ok else '失败'
          now = datetime.now(timezone.utc).astimezone().strftime('%Y-%m-%d %H:%M:%S %z')
          url = result.get('file_url') or '未生成'
          public_update = result.get('public_update') or {}
          public_permission = result.get('public_permission') or {}
          error = result.get('error') or public_update.get('error') or '无'

          Path('docs').mkdir(exist_ok=True)
          status_json = {
              **result,
              'ok': ok,
              'executed_at': now,
              'source_commit': os.environ.get('SOURCE_COMMIT', ''),
              'workflow_url': os.environ.get('RUN_URL', ''),
          }
          Path('docs/FEISHU_HTML_FILE_STATUS.json').write_text(
              json.dumps(status_json, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          content = f'''# 飞书原始 HTML 文件上传状态

          - 结果：**{status}**
          - 执行时间：`{now}`
          - 原文件预览：{url}
          - 公开权限设置：`{json.dumps(public_update, ensure_ascii=False)}`
          - 公开权限复查：`{json.dumps(public_permission, ensure_ascii=False)}`
          - 错误信息：`{error}`
          - 来源提交：`{os.environ.get("SOURCE_COMMIT", "")}`
          - 工作流：{os.environ.get("RUN_URL", "")}

          ## 执行输出

          ```text
          {log}
          ```

          > 这里上传的是由 USER_MANUAL.md 自动生成的原始 HTML 文件，没有转换成飞书在线文档。
          '''
          lines = [line[10:] if line.startswith('          ') else line for line in content.splitlines()]
          Path('docs/FEISHU_HTML_FILE_STATUS.md').write_text(
              '\n'.join(lines).strip() + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit generated HTML and upload status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add USER_MANUAL.html docs/FEISHU_HTML_FILE_STATUS.md docs/FEISHU_HTML_FILE_STATUS.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: rebuild and publish customer HTML manual [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Mark workflow as failed
        if: steps.raw_upload.outcome != 'success'
        run: exit 1
