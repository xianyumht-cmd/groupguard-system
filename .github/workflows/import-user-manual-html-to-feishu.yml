name: Import HTML manual to Feishu

on:
  push:
    branches:
      - main
    paths:
      - USER_MANUAL.html
      - scripts/import_user_manual_html_to_feishu.py
      - .github/workflows/import-user-manual-html-to-feishu.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feishu-html-manual-import
  cancel-in-progress: false

jobs:
  import-html:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Import USER_MANUAL.html
        id: html_import
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          set -o pipefail
          python scripts/import_user_manual_html_to_feishu.py 2>&1 | tee /tmp/feishu-html-import.log

      - name: Write import status
        if: always()
        env:
          IMPORT_OUTCOME: ${{ steps.html_import.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          log_path = Path('/tmp/feishu-html-import.log')
          log = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else '未生成执行日志。'
          log = re.sub(
              r'(?i)(app_secret|tenant_access_token|authorization)(["\':=\s]+)[^,\s"}]+',
              r'\1\2[REDACTED]',
              log,
          )[-6000:]

          result = {}
          start = log.rfind('{')
          while start >= 0:
              try:
                  result = json.loads(log[start:])
                  break
              except Exception:
                  start = log.rfind('{', 0, start)

          outcome = os.environ.get('IMPORT_OUTCOME', 'unknown')
          ok = outcome == 'success' and bool(result.get('ok'))
          status = '成功' if ok else '失败'
          now = datetime.now(timezone.utc).astimezone().strftime('%Y-%m-%d %H:%M:%S %z')
          url = result.get('document_url') or '未生成'
          error = result.get('error') or result.get('job_error_msg') or '无'

          Path('docs').mkdir(exist_ok=True)
          status_json = {
              **result,
              'ok': ok,
              'executed_at': now,
              'source_commit': os.environ.get('SOURCE_COMMIT', ''),
              'workflow_url': os.environ.get('RUN_URL', ''),
          }
          Path('docs/FEISHU_HTML_IMPORT_STATUS.json').write_text(
              json.dumps(status_json, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          content = f'''# 飞书 HTML 手册导入状态

          - 结果：**{status}**
          - 执行时间：`{now}`
          - 飞书文档：{url}
          - 错误信息：`{error}`
          - 来源提交：`{os.environ.get("SOURCE_COMMIT", "")}`
          - 工作流：{os.environ.get("RUN_URL", "")}

          ## 执行输出

          ```text
          {log}
          ```

          > 飞书会把 HTML 导入为在线文档。CSS、JavaScript 和交互效果是否保留，以飞书实际打开效果为准。
          '''
          lines = [line[10:] if line.startswith('          ') else line for line in content.splitlines()]
          Path('docs/FEISHU_HTML_IMPORT_STATUS.md').write_text(
              '\n'.join(lines).strip() + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit import status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FEISHU_HTML_IMPORT_STATUS.md docs/FEISHU_HTML_IMPORT_STATUS.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: update Feishu HTML import status [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Mark workflow as failed
        if: steps.html_import.outcome != 'success'
        run: exit 1
