<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GroupGuard 群管理员手册搜索</title>
  <style>
    :root{color-scheme:light dark;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#dfe4ec;--accent:#2563eb;--mark:#fde68a}
    @media(prefers-color-scheme:dark){:root{--bg:#10131a;--card:#171b24;--text:#eef2f7;--muted:#9ca3af;--line:#303746;--accent:#60a5fa;--mark:#854d0e}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
    .wrap{max-width:1100px;margin:0 auto;padding:20px}.head{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);padding:12px 0}
    .panel,.manual{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
    .panel{padding:18px}.title{font-size:22px;font-weight:700;margin:0 0 6px}.tip{color:var(--muted);font-size:14px;margin:0 0 14px;line-height:1.6}
    .search-row{display:flex;gap:10px;flex-wrap:wrap}.search{flex:1;min-width:240px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:16px;outline:none}.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
    button,.file-label{border:1px solid var(--line);border-radius:10px;padding:11px 15px;background:var(--card);color:var(--text);cursor:pointer;font-size:14px}.file-label input{display:none}.status{margin-top:10px;color:var(--muted);font-size:13px}
    .manual{margin-top:16px;padding:22px;min-height:300px}.content{white-space:pre-wrap;word-break:break-word;font:14px/1.75 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;margin:0}mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}.error{color:#dc2626}
    @media(max-width:640px){.wrap{padding:10px}.manual{padding:15px}.title{font-size:19px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="head">
      <section class="panel">
        <h1 class="title">GroupGuard 群管理员手册</h1>
        <p class="tip">输入指令或功能名即可搜索。正式内容来自同目录下的 USER_MANUAL.md。</p>
        <div class="search-row">
          <input id="search" class="search" type="search" placeholder="例如：禁言、违禁词、查战绩、定时任务" autocomplete="off">
          <button id="clear" type="button">清空</button>
          <label class="file-label">选择手册文件<input id="file" type="file" accept=".md,text/markdown,text/plain"></label>
        </div>
        <div id="status" class="status">正在加载手册……</div>
      </section>
    </div>
    <section class="manual"><pre id="content" class="content"></pre></section>
  </main>
  <script>
    const search=document.getElementById('search');
    const clear=document.getElementById('clear');
    const file=document.getElementById('file');
    const status=document.getElementById('status');
    const content=document.getElementById('content');
    let source='';

    function escapeHtml(value){return value.replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
    function escapeRegExp(value){return value.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
    function render(){
      const keyword=search.value.trim();
      if(!source){content.textContent='';return;}
      if(!keyword){content.textContent=source;status.textContent=`已加载，共 ${source.length} 个字符。`;return;}
      const pattern=new RegExp(escapeRegExp(keyword),'gi');
      const matches=source.match(pattern)||[];
      content.innerHTML=escapeHtml(source).replace(new RegExp(escapeRegExp(escapeHtml(keyword)),'gi'),m=>`<mark>${m}</mark>`);
      status.textContent=matches.length?`找到 ${matches.length} 处匹配。`:'未找到匹配内容。';
      const first=content.querySelector('mark');
      if(first) first.scrollIntoView({behavior:'smooth',block:'center'});
    }
    async function loadDefault(){
      try{
        const response=await fetch('./USER_MANUAL.md',{cache:'no-store'});
        if(!response.ok) throw new Error(`HTTP ${response.status}`);
        source=await response.text();
        render();
      }catch(error){
        status.innerHTML='<span class="error">未能自动加载 USER_MANUAL.md。若直接双击打开本页，请点击“选择手册文件”并选择 USER_MANUAL.md。</span>';
        content.textContent='';
      }
    }
    search.addEventListener('input',render);
    clear.addEventListener('click',()=>{search.value='';render();search.focus();});
    file.addEventListener('change',async()=>{
      const selected=file.files&&file.files[0];
      if(!selected)return;
      source=await selected.text();
      render();
    });
    loadDefault();
  </script>
</body>
</html>
